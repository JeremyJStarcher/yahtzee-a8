FEATURES {
    STARTADDRESS: default = $0300;
}

MEMORY {
    ZP:       start = $0050, size = $0025, file = "", define = yes;
    STACK:    start = $0100, size = $0100, file = "";

    VECTORS:  start = %S - 4, size = $0004, file = %O;
    RAM:      start = %S,     size = $DC00, file = %O, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    VECTORS:  load = VECTORS, type = ro;
    CODE:     load = RAM,     type = ro;
}