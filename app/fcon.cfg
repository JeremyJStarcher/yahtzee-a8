FEATURES {
    STARTADDRESS: default = $0300;
}

MEMORY {
    ZP:       start = $50, size = $25, file = "", define = yes;
    STACK:    start = $100, size = $100, file = "";
    RAM:      start = $0300, size = $DD00, file = yes;
    ROM:      start = $D000, size = $3000, fill = yes;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,        type = zp;
    CODE:      load = ROM,       type = ro, start = $D000;
    JUMPTABLE: load = ROM,       type = ro, start = $FF00;
    VECTORS:   load = ROM,       type = ro, start = $FFFA;
}
