FEATURES {
    STARTADDRESS: default = $D000;
}

MEMORY {
    ZP:       start = $0000, size = $0100, file = "";
    STACK:    start = $0100, size = $0100, file = "";
    IO:       start = $0200, size = $0100, file = "";
    RAM:      start = $0400, size = $8C00, file = "";
    ROM:      start = $D000, size = $3000, fill = yes;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,        type = zp;
    CODE:      load = ROM,       type = ro, start = $D000;
    JUMPTABLE: load = ROM,       type = ro, start = $FF00;
    VECTORS:   load = ROM,       type = ro, start = $FFFA;
}
