FEATURES {
    STARTADDRESS: default = $F000;
}

MEMORY {
    ZP:       start = $00, size = $100, file = "";
    STACK:    start = $100, size = $100, file = "";
    RAM:      start = $2000, size = $C000, file = "";
    ROM:      start = $F000, size = $1000, fill = yes;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,        type = zp;
    CODE:      load = ROM,       type = ro, start = $F000;
    JUMPTABLE: load = ROM,       type = ro, start = $FF00;
    VECTORS:   load = ROM,       type = ro, start = $FFFA;
}
